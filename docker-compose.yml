services:
  devices-api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Data Source=/app/App_Data/devices.db"

    volumes:
      - devices-data:/app/App_Data

    restart: unless-stopped

volumes:
  devices-data:
